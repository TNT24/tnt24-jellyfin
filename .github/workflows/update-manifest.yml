name: Update manifest

# Rebuilds manifest.json from each plugin's own manifest. Runs hourly, on demand
# (Actions → Update manifest → Run workflow), and when sources.txt changes.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]
  push:
    branches: [main]
    paths: [sources.txt, .github/workflows/update-manifest.yml]

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge plugin manifests
        run: |
          set -euo pipefail
          mkdir -p parts
          i=0
          grep -Ev '^\s*(#|$)' sources.txt | while read -r url; do
            i=$((i + 1))
            # A missing or broken manifest fails the run, so a plugin is never dropped by accident.
            curl -fsSL --retry 3 "$url?$(date +%s)" -o "parts/$(printf '%02d' "$i").json"
            jq -e 'type == "array" and length > 0 and all(.[]; (.guid | type == "string") and (.versions | type == "array"))' \
              "parts/$(printf '%02d' "$i").json" > /dev/null || { echo "Not a plugin manifest: $url"; exit 1; }
          done
          jq -s 'add | unique_by(.guid) | sort_by(.name | ascii_downcase)' parts/*.json > manifest.json
          rm -rf parts
          jq -r '.[] | "\(.name): \(.versions[0].version)"' manifest.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- manifest.json && git ls-files --error-unmatch manifest.json > /dev/null 2>&1; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest"
          git push
